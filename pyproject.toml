[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "systemsentinel"
version = "0.1.0.dev2"
description = "Read-only Linux software inventory and security maintenance assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
systemsentinel = "systemsentinel.cli:main"
systemsentinel-gui = "systemsentinel.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
