name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: systemsentinel scan --format json > /tmp/sentinel-inventory.json

  linux-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [debian:12, ubuntu:24.04]
    container: ${{ matrix.image }}
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-apt python3-tk xvfb xauth git ca-certificates desktop-file-utils
      - uses: actions/checkout@v7.0.1
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - run: PYTHONPATH=src python3 -m systemsentinel scan --updates --config --format json > /tmp/sentinel-inventory.json
      - run: desktop-file-validate desktop/systemsentinel.desktop
      - run: PYTHONPATH=src xvfb-run -a python3 tests/gui_smoke.py
